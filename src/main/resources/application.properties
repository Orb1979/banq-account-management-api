spring.application.name=banq-account-management-api

# H2 in-memory database
# DB_CLOSE_DELAY=-1 keeps that database alive when the pool has no open connections.
# DB_CLOSE_ON_EXIT=FALSE turns off H2's own JVM shutdown hook so Spring can close the pool cleanly.
spring.datasource.url=jdbc:h2:mem:banq;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view = false